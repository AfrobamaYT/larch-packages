# Larch's graphics profiles for chwd, adapted from CachyOS's chwd 1.24.1
# (https://github.com/CachyOS/chwd, commit e99ec339715f, GPL-3.0-or-later),
# profiles/pci/graphic_drivers/profiles.toml. Changes, each because the
# upstream line would fail or do the wrong thing on Larch:
# - NVIDIA: prebuilt nvidia-open / nvidia-open-lts for Arch's kernels, DKMS
#   with headers for any other kernel (upstream: linux-cachyos-*-nvidia-open).
# - The kms drop-in is 90-chwd-kms.conf, not 10-: mkinitcpio reads drop-ins in
#   order, and Larch's 10-larch-hooks.conf sets HOOKS, kms included, after a
#   10-chwd file -- the removal would silently not happen.
# - cachyos-drm-awaiter and nouveau-fw exist only in CachyOS's repositories;
#   nouveau takes linux-firmware-nvidia, and libva-intel-driver-irql is Arch's
#   libva-intel-driver.
# - No X11 drivers or tools (xf86-video-*, xf86-input-vmmouse, gtkmm3): Larch
#   runs Wayland only.
# The 580xx and 470xx packages are AUR builds and have to be served from
# [larch] before those profiles can install.
#
# chwd has a sequential search for the desired profile. First it goes through
# all class_ids that indicate a device type, like GPU or network adapter. Then
# the profile specifies which manufacturer's driver we need via vendor_id,
# after which chwd select specific device in device_id or device_pattern, which
# is how much wider and includes devices of the same generation. For example:
#
# Searched for 3D controllers
# class_ids = "0302"
#
# Filters only NVIDIA GPUs
# vendor_ids = "10de"
#
# A certain device or set of ids:
# device_ids = "25a2"
#
# Or set of devices depending on the generation:
# device_name_pattern = '(AD)\w+'

[nvidia-open]
desc = 'Open source NVIDIA drivers for Linux (Latest)'
class_ids = "0300 0302 0380"
vendor_ids = "10de"
device_ids = "*"
priority = 10
driver_conflict_group = "nvidia"
packages = 'nvidia-utils egl-wayland nvidia-settings opencl-nvidia lib32-opencl-nvidia lib32-nvidia-utils libva-nvidia-driver vulkan-icd-loader lib32-vulkan-icd-loader'
conditional_packages = """
    # Larch: Arch builds the open modules for its own two kernels; any other
    # kernel means DKMS for all of them, with each kernel's headers.
    prebuilt="" headers="" dkms=0
    for pkgbase in /usr/lib/modules/*/pkgbase; do
        kernel="$(cat "$pkgbase")"
        case "$kernel" in
            linux)     prebuilt="$prebuilt nvidia-open" ;;
            linux-lts) prebuilt="$prebuilt nvidia-open-lts" ;;
            *)         dkms=1 ;;
        esac
        headers="$headers ${kernel}-headers"
    done
    if [ "$dkms" = 1 ] || [ -z "$prebuilt" ]; then
        echo "nvidia-open-dkms$headers"
    else
        echo "$prebuilt"
    fi
"""
pre_install = """
    cat <<'EOF' >/etc/mkinitcpio.conf.d/90-chwd-kms.conf
# This file is automatically generated by chwd. PLEASE DO NOT EDIT IT.
HOOKS=(${HOOKS[@]/kms/})
EOF
"""
pre_remove = """
    rm -f /etc/mkinitcpio.conf.d/90-chwd-kms.conf
"""

[nvidia-open.prime]
desc = 'Open source NVIDIA drivers for Linux laptops (Latest)'
priority = 11
packages = 'nvidia-utils egl-wayland nvidia-settings opencl-nvidia lib32-opencl-nvidia lib32-nvidia-utils libva-nvidia-driver vulkan-icd-loader lib32-vulkan-icd-loader nvidia-prime switcheroo-control'
chassis_types = "8 9 10 11 31"
post_install = """
    # nvidia-powerd is not supported by Turing GPUs
    if ! lspci -d "10de:*:030x" -vm | grep -q 'Device:\\tTU.*'; then
        systemctl enable nvidia-powerd
    else
        cat << 'EOF' >/etc/modprobe.d/chwd-nvidia.conf
# This file is automatically generated by chwd. PLEASE DO NOT EDIT IT.
options nvidia NVreg_DynamicPowerManagement=0x02
EOF
    fi

    systemctl enable switcheroo-control
"""
post_remove = """
    rm -f /etc/modprobe.d/chwd-nvidia.conf
"""

[nvidia-dkms-580xx]
desc = 'Closed source NVIDIA drivers for Linux (580xx)'
class_ids = "0300 0302 0380"
vendor_ids = "10de"
priority = 12
driver_conflict_group = "nvidia"
packages = 'nvidia-580xx-dkms nvidia-580xx-utils nvidia-580xx-settings opencl-nvidia-580xx lib32-opencl-nvidia-580xx lib32-nvidia-580xx-utils libva-nvidia-driver vulkan-icd-loader lib32-vulkan-icd-loader'
device_ids = '>/var/lib/chwd/ids/nvidia-580.ids'
conditional_packages = """
    for pkgbase in /usr/lib/modules/*/pkgbase; do
        kernel="$(cat "$pkgbase")"
        echo "${kernel}-headers"
    done
"""
pre_install = """
    cat <<'EOF' >/etc/mkinitcpio.conf.d/90-chwd-kms.conf
# This file is automatically generated by chwd. PLEASE DO NOT EDIT IT.
HOOKS=(${HOOKS[@]/kms/})
EOF
"""
pre_remove = """
    rm -f /etc/mkinitcpio.conf.d/90-chwd-kms.conf
"""

[nvidia-dkms-580xx.prime]
desc = 'Closed source NVIDIA drivers for Linux laptops (580xx)'
priority = 13
packages = 'nvidia-580xx-dkms nvidia-580xx-utils nvidia-580xx-settings opencl-nvidia-580xx lib32-opencl-nvidia-580xx lib32-nvidia-580xx-utils libva-nvidia-driver vulkan-icd-loader lib32-vulkan-icd-loader nvidia-prime switcheroo-control'
chassis_types = "8 9 10 11 31"
post_install = """
    systemctl enable switcheroo-control
"""

[nvidia-dkms-470xx]
desc = 'Closed source NVIDIA drivers for Linux (470xx branch, only for Kepler GPUs)'
priority = 14
class_ids = "0300 0302 0380"
vendor_ids = "10de"
device_ids = '>/var/lib/chwd/ids/nvidia-470.ids'
driver_conflict_group = "nvidia"
packages = 'nvidia-470xx-dkms nvidia-470xx-utils nvidia-470xx-settings opencl-nvidia-470xx vulkan-icd-loader lib32-nvidia-470xx-utils lib32-opencl-nvidia-470xx lib32-vulkan-icd-loader libva-nvidia-driver'

[nvidia-dkms-470xx.prime]
desc = 'Closed source NVIDIA drivers for Linux (470xx branch, only for mobile Kepler GPUs)'
priority = 15
packages = 'nvidia-470xx-dkms nvidia-470xx-utils nvidia-470xx-settings opencl-nvidia-470xx vulkan-icd-loader lib32-nvidia-470xx-utils lib32-opencl-nvidia-470xx lib32-vulkan-icd-loader libva-nvidia-driver nvidia-prime switcheroo-control'
chassis_types = "8 9 10 11 31"
post_install = """
    systemctl enable switcheroo-control
"""

[nouveau]
desc = "Open Nouveau driver for NVIDIA graphics cards (Only for old GPUs)"
class_ids = "0300 0302"
vendor_ids = "10de"
device_ids = '>/var/lib/chwd/ids/nouveau.ids'
priority = 18
packages = 'mesa lib32-mesa linux-firmware-nvidia opencl-mesa lib32-opencl-mesa'
conditional_packages = """
# Install vulkan-nouveau and linux-firmware-nvidia only for Kepler GPUs
device_id="$(lspci -d "10de:*:030x" -n | cut -d" " -f3 | cut -d":" -f2 | head -n1)"
if grep -q "$device_id" /var/lib/chwd/ids/nvidia-470.ids 2>/dev/null; then
    echo "vulkan-nouveau linux-firmware-nvidia"
fi
"""
post_install = """
# Force the use of Rusticl, otherwise it will be just a stub
echo "export RUSTICL_ENABLE=nouveau" > /etc/profile.d/opencl.sh
mkdir -p /etc/environment.d
echo "RUSTICL_ENABLE=nouveau" > /etc/environment.d/30-opencl.conf

# Performance improvement for Fermi GPUs
device_id="$(lspci -d "10de:*:030x" -n | cut -d" " -f3 | cut -d":" -f2 | head -n1)"
if grep -q "$device_id" /var/lib/chwd/ids/nvidia-390.ids 2>/dev/null; then
    cat <<'EOF' >/etc/modprobe.d/20-nouveau-nvboost.conf
# This file is automatically generated by chwd. PLEASE DO NOT EDIT IT.
options nouveau config=NvBoost=2
EOF
fi
"""
post_remove = """
rm -f /etc/profile.d/opencl.sh
rm -f /etc/environment.d/30-opencl.conf

device_id="$(lspci -d "10de:*:030x" -n | cut -d" " -f3 | cut -d":" -f2 | head -n1)"
if grep -q "$device_id" /var/lib/chwd/ids/nvidia-390.ids 2>/dev/null; then
    rm -f /etc/modprobe.d/20-nouveau-nvboost.conf
fi
"""

[intel]
desc = "Mesa open source driver for Intel"
class_ids = "0300 0302 0380"
vendor_ids = "8086"
device_ids = "*"
priority = 4
packages = 'mesa lib32-mesa vulkan-intel lib32-vulkan-intel gst-plugin-va linux-firmware-intel'
conditional_packages = """
if [ -z "$(lspci -d "10de:*:030x")" ]; then
    echo "opencl-mesa lib32-opencl-mesa"
fi

device_id="$(lspci -d "8086:*:030x" -n | cut -d" " -f3 | cut -d":" -f2 | head -n1)"
if grep -q "$device_id" /var/lib/chwd/ids/intel-vaapi.ids 2>/dev/null; then
    echo "libva-intel-driver"
else
    echo "intel-media-driver"
fi

if grep -q "$device_id" /var/lib/chwd/ids/intel-media-sdk.ids 2>/dev/null; then
    echo "intel-media-sdk"
else
    if ! grep -q "$device_id" /var/lib/chwd/ids/intel-vaapi.ids 2>/dev/null; then
        echo "vpl-gpu-rt"
    fi
fi
"""
post_install = """
if [ -z "$(lspci -d "10de:*:030x")" ]; then
    # Force the use of Rusticl, otherwise it will be just a stub
    echo "export RUSTICL_ENABLE=iris" > /etc/profile.d/opencl.sh
    mkdir -p /etc/environment.d
    echo "RUSTICL_ENABLE=iris" > /etc/environment.d/30-opencl.conf
fi
"""
post_remove = """
rm -f /etc/profile.d/opencl.sh
rm -f /etc/environment.d/30-opencl.conf
"""

[amd]
desc = "Mesa open source driver for AMD"
class_ids = "0300 0302 0380"
vendor_ids = "1002"
device_ids = "*"
priority = 4
packages = 'mesa lib32-mesa vulkan-radeon lib32-vulkan-radeon gst-plugin-va linux-firmware-amdgpu'
conditional_packages = """
if [ -z "$(lspci -d "10de:*:030x")" ]; then
    echo "opencl-mesa lib32-opencl-mesa"
fi
"""

[fallback]
desc = 'Fallback profile'
class_ids = "0300 0380 0302"
vendor_ids = "1002 8086 10de"
device_ids = "*"
priority = 3
packages = 'mesa lib32-mesa vulkan-swrast lib32-vulkan-swrast'

[virtualbox]
vendor_ids = "80EE"
device_ids = "*"
class_ids = "0300"
desc = 'VirtualBox tools'
priority = 5
environment_types = "oracle"
packages = 'virtualbox-guest-utils'
post_install = """
    # Load kernel modules and sync clock
    systemctl enable --now --no-block vboxservice.service
"""
post_remove = """
    systemctl disable --now vboxservice.service
"""

[vmware]
vendor_ids = "15AD"
device_ids = "*"
class_ids = "0300"
desc = 'X.org vmware video driver and open-vm-tools'
priority = 5
environment_types = "vmware"
packages = 'open-vm-tools vulkan-swrast lib32-vulkan-swrast'
post_install = """
    systemctl enable --now --no-block vmtoolsd.service
"""
post_remove = """
    systemctl disable --now vmtoolsd.service
"""

[qemu]
vendor_ids = "1af4 1b36 1013 1234"
device_ids = "*"
class_ids = "0300"
desc = 'QEMU/KVM guest drivers'
priority = 5
environment_types = "kvm qemu"
packages = 'spice-vdagent qemu-guest-agent vulkan-virtio lib32-vulkan-virtio'
post_install = """
    cat <<EOF >/etc/mkinitcpio.conf.d/10-chwd-qemu.conf
# This file is automatically generated by chwd. PLEASE DO NOT EDIT IT.
MODULES+=(virtio virtio_blk virtio_pci virtio_net)
EOF
    mkinitcpio -P
"""
pre_remove = """
    rm -f /etc/mkinitcpio.conf.d/10-chwd-qemu.conf
"""
